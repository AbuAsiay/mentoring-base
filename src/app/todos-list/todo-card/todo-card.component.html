
<div class="todo-card">
    <p>ТЕКСТ ЗАДАЧИ:</p>
    <div>
        {{todo.title}}
    </div>

    <p>АВТОР ЗАДАЧИ</p>
    <div>
        {{todo.userId}}
    </div>

    <p>ЗАДАЧА ЗАВЕРШИНА:</p>
    {{todo.completed ? 'ДА' : 'НЕТ'}}

    <button class="todo-card-delete" (click)=onDeleteTodo(todo.id)>УДАЛИТЬ
        ЗАДАЧУ</button>
</div>
