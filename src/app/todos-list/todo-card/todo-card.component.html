<div style="width: 200px; height: 250px;; box-shadow: 0px 20px 50px 0px rgba(18, 17, 39, 0.08);
    background: rgb(255, 255, 255); margin: 10px; padding: 10px;">

    <p>ТЕКСТ ЗАДАЧИ:</p> 
    <div>
        {{todo.title |  truncate }}
    </div>

    <p>АВТОР ЗАДАЧИ</p>
    <div>
        {{todo.userId}}
    </div>

    <p>ЗАДАЧА ЗАВЕРШИНА:</p>
    <div>
        {{todo.completed ? 'ДА' : 'НЕТ'}}
    </div>

    <button (click)=onDeleteTodo(todo.id)
        style="border:1px solid #f0ba4e;border-radius:54px;height:35;width:150px;">УДАЛИТЬ ЗАДАЧУ</button>
</div>
