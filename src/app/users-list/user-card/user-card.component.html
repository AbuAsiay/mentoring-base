<div boxshadow class="user-card">
  <p>{{ user.name | customUpperCase }}</p>
  <p>{{ user.email | customUpperCase }}</p>
  <p>{{ user.website | customUpperCase }}</p>
  <p>{{ user.company.name}}</p>
  <button mat-raised-button  class="snap" (click)="onDeleteUser(user.id)"
    red>УДАЛИТЬ </button>
  <button mat-raised-button class="snap-1" (click)="openDialog()"
    red>РЕДАКТИРОВАТЬ </button>
</div>
