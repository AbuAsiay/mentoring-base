<div  boxshadow
    style="width: 210px; height: 220px; 
    background: rgb(255, 255, 255); margin: 10px; padding: 10px;">
    <p >{{user.name | customUpperCase }}</p>
    <p >{{user.email |  customUpperCase }}</p>
    <p >{{user.website |  customUpperCase}}</p>
    <p >{{user.company.name}}</p>
    <button  mat-raised-button class="snap"(click)=onDeleteUser(user.id) red> УДАЛИТЬ </button>
    <button  mat-raised-button  class="snap-1"(click)=openDialog() red>РЕДАКТИРОВАТЬ </button>
</div>
