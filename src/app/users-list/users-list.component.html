<app-create-user-form (createUser)="createUser($event)"></app-create-user-form>
<div style="display: flex; flex-wrap: wrap; padding: 0px 240px; ">
  <div *ngFor="let user of usersService.usersSubject$ | async">
    <app-user-card
      [user]="user"
      (deleteUser)="deleteUser($event)"
      (editUser)="editUser($event)" 
    ></app-user-card>
  </div>
</div>
