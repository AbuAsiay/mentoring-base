<app-create-user-form (createUser)="createUser($event)"></app-create-user-form>

<button class="create-user-dialog"
  matTooltip="Создать Юзера"
  mat-raised-button
  color="primary"
  matIconSuffix
  (click)="openDialog()">
  CREATE USER
  <mat-icon>edit</mat-icon>
</button>

<div class="users-list">
  <div *ngFor="let user of users$ | async">
    <app-user-card [user]="user" (deleteUser)="deleteUser($event)"
      (editUser)="editUser($event)">
    </app-user-card>
  </div>
</div>
