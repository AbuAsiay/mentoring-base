<div class="form-group">
    <h1>CREATE USER FORM</h1>
    <form style="display: flex; flex-direction: column"
        [formGroup]="form"
        (ngSubmit)="submitForm()">
        <mat-form-field>
            <mat-label>Введите имя пользователя</mat-label>
            <input matInput formControlName="name">
            <mat-error>Некорректное значение</mat-error>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Введите Email</mat-label>
            <input matInput formControlName="email">
            <mat-error>Некорректное значение</mat-error>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Введите Wibsite</mat-label>
            <input matInput formControlName="website">
            <mat-error>Некорректное значение</mat-error>
        </mat-form-field>
        <div formGroupName="company">
            <mat-form-field>
                <mat-label>Введите company</mat-label>
                <input matInput formControlName="name">
                <mat-error>Некорректное значение</mat-error>
            </mat-form-field>
        </div>
        <button matTooltip="Создать Юзера" mat-raised-button
            matIconSuffix mat-raised-button
            [disabled]="form.invalid">Add User
            <mat-icon>add</mat-icon>
        </button>
    </form>
</div>
